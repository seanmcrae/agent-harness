[project]
name = "agent-harness"
version = "0.1.0"
description = "A small runtime for multi-step tool-using LLM agents with guardrails, budgets, tracing, and scenario evals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sean McRae" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.66"]
otel = ["opentelemetry-sdk>=1.25"]
# Charts and the static documentation site (make charts / make site).
docs = [
    "matplotlib>=3.8",
    "jinja2>=3.1",
    "markdown>=3.5",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "types-Markdown>=3.5",
    "opentelemetry-sdk>=1.25",
]

[project.urls]
Homepage = "https://seanmcrae.github.io/agent-harness/"
Documentation = "https://seanmcrae.github.io/agent-harness/"
Repository = "https://github.com/seanmcrae/agent-harness"
Changelog = "https://github.com/seanmcrae/agent-harness/blob/main/CHANGELOG.md"

[project.scripts]
agent = "agent_harness.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_harness"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PL", "PT"]
# Optional SDKs (anthropic, openai, opentelemetry) are imported lazily on purpose.
ignore = ["PLR0911", "PLR0913", "PLR2004", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]
# Typer derives CLI options from function parameters.
"src/agent_harness/cli.py" = ["PLR0917"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["anthropic.*", "openai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["agent_harness"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
